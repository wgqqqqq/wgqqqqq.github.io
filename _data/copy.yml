  nav_lang_en: EN
  home_kicker: Position
  home_title: Local developer infrastructure for agents
  home_lede: "I care about how agents work in real engineering environments: large-repo search, incremental indexing, workspace state, tool execution, and desktop runtimes. BitFun is the current product surface; flashgrep is the search and indexing infrastructure line."
  work_kicker: Work surface
  work_title: "Two threads: product runtime and search infrastructure"
  work_note: "The goal is not another chat shell; it is the local infrastructure agents repeatedly need to do useful work."
  proof_kicker: Evidence
  proof_title: flashgrep is benchmarked on Chromium-scale search
  proof_body: "445,491 indexable documents; clean-H0 fixed-string query at 326 ms versus rg at 7,812 ms. Cold queries cover regex, word boundaries, path scope, and no-match behavior."
  proof_items:
    - label: corpus
      value: 445k docs
    - label: clean query
      value: 326 ms
    - label: rg baseline
      value: 7,812 ms
  work_items:
    - title: BitFun
      role: Current product work
      period: 2026–present
      summary: BitFun is a desktop-grade agent runtime and agent-app work surface. I focus on making Code Agent, Cowork Agent, Computer Use, state, and tool execution fit real workflows.
      highlights:
        - Code Agent / Cowork Agent / Computer Use
        - Local runtime and desktop workflows
        - Tool execution, memory, and long-task state
      tags: [Rust, TypeScript, Tauri, MCP]
      links:
        - label: Website
          url: https://openbitfun.com/
        - label: Source
          url: https://github.com/GCWing/BitFun
    - title: flashgrep
      role: Search infrastructure
      period: 2026–present
      summary: "flashgrep is a local regex prefilter index system for large Git worktrees: character-level candidate recall first, exact regex verification second."
      highlights:
        - Base snapshot + published workspace overlay
        - Managed daemon, MCP server, and host-product integration
        - "Chromium benchmark: 445k indexable docs; 326 ms vs rg 7,812 ms on clean H0"
      tags: [Rust, regex, indexing, daemon]
      links:
        - label: Source
          url: https://github.com/wgqqqqq/flashgrep
